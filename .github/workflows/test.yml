name: test

# Only runs when code it can test changes, to keep CI minutes low.
on:
  pull_request:
    paths:
      - "ros_ws/**"
      - "cognition/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "ros_ws/**"
      - "cognition/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros:
    name: colcon build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
        working-directory: ros_ws
    steps:
      - uses: actions/checkout@v7

      - name: Install package dependencies
        run: |
          apt-get update -qq
          rosdep update --rosdistro jazzy -q
          rosdep install --from-paths src --ignore-src -y -q

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: colcon-test-results
          path: ros_ws/build/*/pytest.xml
          retention-days: 7
          if-no-files-found: ignore

  python:
    name: pytest (cognition)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check for Python code
        id: detect
        run: |
          if find cognition -name '*.py' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Python code in cognition/ yet; skipping."
          fi

      - uses: actions/setup-python@v7
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Run pytest with coverage
        if: steps.detect.outputs.present == 'true'
        run: |
          pip install pytest pytest-cov
          if [ -f cognition/requirements.txt ]; then pip install -r cognition/requirements.txt; fi
          pytest cognition --cov=cognition --cov-report=xml --junitxml=pytest-cognition.xml

      - name: Upload coverage and results
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cognition-test-results
          path: |
            coverage.xml
            pytest-cognition.xml
          retention-days: 7
