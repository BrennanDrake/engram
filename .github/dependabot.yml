# Weekly, grouped updates so each week brings at most one PR per ecosystem.
# pip and docker entries get added alongside the first requirements file and
# Dockerfile (epic E2); Dependabot reports an error for ecosystems with no files.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
