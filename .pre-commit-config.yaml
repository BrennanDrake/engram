# Quality gates for the whole repo. CI runs exactly this file.
# Run locally with: pre-commit run --all-files
# Every hook is pinned; Dependabot/`pre-commit autoupdate` bumps them.
default_install_hook_types: [pre-commit]
exclude: ^(ros_ws/(build|install|log)/)

repos:
  # Generic text hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
      - id: check-toml
      # Well-formedness of package.xml and launch XML; schema checks
      # run in colcon test via ament_xmllint.
      - id: check-xml

  # Python: lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Python: strict type checking (settings in pyproject.toml)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies: [pytest]  # typed fixtures and marks in tests
        # Launch files are declarative; their `launch/` dir also shadows the launch package
        exclude: ^(training/|ros_ws/src/.*/(test|launch)/)

  # C++ formatting (style in .clang-format)
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]

  # ROS parameter files, compose files, workflows
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # Dockerfiles
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        files: (Dockerfile|\.Dockerfile)$

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # Markdown (rules in .markdownlint-cli2.yaml)
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  # Spelling in code and docs
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^LICENSE$
