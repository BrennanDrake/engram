- name: Add the Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Start tailscaled at boot
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Check whether this host has joined the tailnet
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Join the tailnet
  ansible.builtin.command:
    cmd: >-
      tailscale up --authkey={{ tailscale_authkey }} --hostname={{ tailscale_hostname }}
  no_log: true
  changed_when: true
  when:
    - tailscale_authkey | length > 0
    - ((tailscale_status.stdout or '{}') | from_json).get('BackendState') != 'Running'
